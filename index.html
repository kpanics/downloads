<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPanicShop | Центр Загрузок</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 340px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; font-size: 20px; color: #fff; }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }
        input:focus { border-color: #007bff; outline: none; }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        .error-msg { color: #ff4d4d; margin-top: 15px; font-size: 14px; display: none; }
        
        /* Контейнер для скрытой загрузки */
        .download-container {
            display: none;
            margin-top: 20px;
            background: #252525;
            padding: 15px;
            border-radius: 6px;
            border: 1px dashed #3a3a3a;
        }
        iframe {
            width: 100%;
            height: 60px;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>✨ KPanicShop Downloads</h2>
    <div id="auth-form">
        <input type="text" id="username" placeholder="Введите Логин" required>
        <input type="password" id="password" placeholder="Введите Пароль" required>
        <button onclick="checkAccess()">Получить доступ</button>
    </div>
    <div id="error" class="error-msg">Неверный логин или пароль!</div>

    <!-- Защищенная зона скачивания, которая активируется только после ввода пароля -->
    <div id="secure-zone" class="download-container">
        <p style="font-size: 14px; margin: 0 0 10px 0; color: #2ecc71;">Доступ разрешен! Нажмите кнопку ниже:</p>
        <iframe id="google_frame" src=""></iframe>
    </div>
</div>

<script>
function checkAccess() {
    var user = document.getElementById('username').value.trim();
    var pass = document.getElementById('password').value.trim();
    var errorDiv = document.getElementById('error');
    var secureZone = document.getElementById('secure-zone');
    var authForm = document.getElementById('auth-form');
    var iframe = document.getElementById('google_frame');

    if (!user || !pass) {
        errorDiv.innerText = "Заполните все поля!";
        errorDiv.style.display = "block";
        return;
    }

    var secretFileName = user + "_" + pass + ".txt";
    var fileUrl = "files/" + secretFileName;

    errorDiv.style.display = "none";

    var xhr = new XMLHttpRequest();
    xhr.open('GET', fileUrl, true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
            if (xhr.status === 200) {
                var fileId = xhr.responseText.trim();
                
                // Генерируем встроенный плеер скачивания Google, который не показывает интерфейс диска
                var embedUrl = "https://drive.google.com/file/d/" + fileId + "/preview";
                
                // Прячем форму ввода рангов
                authForm.style.display = "none";
                
                // Загружаем плеер в невидимую для внешних ссылок коробку
                iframe.src = embedUrl;
                secureZone.style.display = "block";
            } else {
                errorDiv.innerText = "Неверный логин или пароль!";
                errorDiv.style.display = "block";
            }
        }
    };
    xhr.send();
}
</script>

</body>
</html>
